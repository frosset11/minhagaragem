<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121314">
<title>AUTODEX</title>
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AUTODEX">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/vendor/supabase-2.45.4.js"></script>
<script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');</script>
<style>
:root{
  --bg:#121314; --s1:color-mix(in srgb,var(--bg),#fff 2.5%); --s2:color-mix(in srgb,var(--bg),#fff 5%); --s3:color-mix(in srgb,var(--bg),#fff 8%);
  --line:color-mix(in srgb,var(--bg),#fff 10%); --line2:color-mix(in srgb,var(--bg),#fff 16%);
  --fg:#f5f5f6; --fg2:#a9abb0; --fg3:#74767c;
  --danger:#f2786f; --ok:#9ad0a6; --warn:#e6c27a;
  --r:12px; --r-sm:8px;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:120ms; --t-med:220ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
#view:focus,#view:focus-visible{outline:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:28px;height:28px;border-radius:7px}
.brand img.logo{width:auto;max-width:150px;object-fit:contain;border-radius:4px}
.brand img.logo ~ .brand-g::before{display:none}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw-g{display:grid;grid-template-columns:44px 1fr;gap:10px 8px;align-items:center;margin-bottom:6px}.sw-g .hint{font-size:12.5px}
.sw button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.sw input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line2);border-radius:50%;background:none;cursor:pointer;min-height:0}
.sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}.sw input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.logo-pv{height:48px;max-width:220px;object-fit:contain;display:block;margin-bottom:10px}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.02em}
.brand-g{color:var(--fg3);font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-g:not(:empty)::before{content:"/";margin-right:10px;color:var(--line2)}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:8px}
.start button{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--s1);padding:20px;display:flex;flex-direction:column;gap:6px;transition:border-color var(--t-fast),background var(--t-fast)}
.start button:hover{border-color:var(--line2);background:var(--s2)}
.start button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.start b{font-size:16px;font-weight:600}
.start span{color:var(--fg2);font-size:14px;line-height:1.5}
.start .n{font-family:'Geist Mono',monospace;color:var(--fg3);font-size:12px}
.start.stack{grid-template-columns:1fr;margin-top:0}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tab{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--fg2);font-weight:500;font-size:14px;white-space:nowrap;transition:color var(--t-fast),background var(--t-fast)}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--fg);color:var(--bg)}
.tab .n{font-family:var(--mono);font-size:12px;opacity:.6;margin-left:6px}
.acct{display:flex;align-items:center;gap:8px;flex-shrink:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.live[data-s="live"] i{background:var(--ok)}
.live[data-s="offline"] i{background:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:background var(--t-fast),border-color var(--t-fast)}
.btn:hover{background:var(--s3)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#dcdcde}
.btn.danger{border-color:#5a2f2c;color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#1a0d0c;border-color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line2);background:transparent;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--s3)}
.iconbtn svg{width:18px;height:18px}

/* layout */
main{max-width:1240px;margin:0 auto;padding:40px 24px 96px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:500;margin:0 0 6px}
h1{font-size:40px;line-height:1.05;letter-spacing:-.035em;font-weight:600;margin:0}
h2{font-size:18px;letter-spacing:-.015em;font-weight:600;margin:0 0 14px}
.sub{color:var(--fg2);margin:8px 0 0}
.hint{color:var(--fg3);font-size:13px}

/* vehicle grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:block;text-decoration:none;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color var(--t-med),transform var(--t-med) var(--ease)}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.ph{aspect-ratio:16/10;background:var(--s2);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .mk{position:absolute;inset:0;display:grid;place-items:center;color:var(--line2);font-weight:700;font-size:56px;letter-spacing:-.05em;user-select:none}
.ph .st{position:absolute;top:12px;left:12px}
.ph img.illus{object-fit:contain;background:#e5e5e5}
.ph img.dim{opacity:.35;filter:grayscale(.4)}
.ill-prog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70%,320px);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.ill-prog b{font-size:13.5px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ill-bar{width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ill-bar i{display:block;height:100%;width:0;background:#fff;border-radius:inherit;transition:width 1s linear}
.app .ic img.dim{opacity:.35}
.in-steps{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:14px}
.in-steps li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.in-n{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0}
.in-share{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.in-link{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 12px;font-family:'Geist Mono',monospace;font-size:13px;color:var(--fg2)}
.in-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:0 0 20px;font-size:14px}
.pl-use{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 28px;max-width:760px}
.pl-use h2{margin:0 0 12px;font-size:16px}
.pl-m{margin:0 0 12px}
.pl-m-t{display:flex;justify-content:space-between;font-size:14px;margin:0 0 6px}
.pl-bar{height:6px;border-radius:999px;background:var(--line2);overflow:hidden}
.pl-bar i{display:block;height:100%;background:var(--fg);border-radius:inherit}
.pl-bar.near i{background:var(--warn)}
.pl-bar.full i{background:var(--danger)}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pl{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column}
.pl.on{border-color:var(--fg)}
.pl h3{margin:0 0 4px;font-size:18px}
.pl-p{margin:0 0 6px;font-size:15px}
.pl-p b{font-size:26px;font-weight:600;letter-spacing:-.01em}
.pl-b{margin:0 0 14px}
.pl ul{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px;font-size:14px;flex:1}
.pl li::before{content:"✓";margin-right:8px;color:var(--fg3)}
.pl-a{min-height:40px;display:flex;align-items:center}
.pl-cur{font-size:14px;color:var(--fg2);font-weight:500}
.tps{display:flex;flex-direction:column;gap:10px}
.tp{border:1px solid var(--line2);border-radius:var(--r-sm);padding:14px 16px}
.tp.on{border-color:var(--fg)}
.tp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}
.tp-h > b{font-size:16px}
.tp-h b{font-weight:600}
.tp ul{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13.5px;color:var(--fg2)}
.tp li b{color:var(--fg)}
.tp .btn{width:100%}
@media (max-width:420px){.tp ul{grid-template-columns:1fr}}
a.btn{text-decoration:none}
.tour-dots{display:flex;gap:6px;margin:0 0 22px}
.tour-dots i{height:4px;flex:1;border-radius:999px;background:var(--line2)}
.tour-dots i.done{background:var(--fg3)}
.tour-dots i.on{background:var(--fg)}
.tour-h{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 10px}
.tour-t{color:var(--fg2);font-size:15px;line-height:1.55;margin:0 0 16px}
.tour-l{margin:0 0 22px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tour-l li{position:relative;padding-left:20px;font-size:14px;line-height:1.5}
.tour-l li::before{content:"";position:absolute;left:4px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.gs{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 32px}
.gs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.gs-top h2{margin:0;font-size:16px}
.gs-bar{height:4px;border-radius:999px;background:var(--line2);margin:14px 0 6px;overflow:hidden}
.gs-bar i{display:block;height:100%;background:var(--fg);border-radius:inherit}
.gs-l{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 24px}
.gs-l li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;min-height:44px}
.gs-c{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;flex-shrink:0}
.gs-l li.ok .gs-c{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.gs-l li.ok .gs-t{color:var(--fg3);text-decoration:line-through}
.gs-t{flex:1;min-width:0}
.help-g{margin:0 0 28px;max-width:760px}
.help-g h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:500;margin:0 0 6px}
.help-a{border-bottom:1px solid var(--line)}
.help-a summary{cursor:pointer;padding:14px 0;font-weight:500;font-size:15px;list-style-position:outside}
.help-a p{margin:0 0 16px;color:var(--fg2);line-height:1.6;font-size:14.5px}
.choice{display:flex;flex-direction:column;gap:8px;margin:-4px 0 16px}
.choice[hidden]{display:none}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.choice label:has(input:checked){border-color:var(--fg)}
.choice input{margin-top:3px}
.choice span{display:flex;flex-direction:column;gap:2px}
.choice small{color:var(--fg3);font-size:12.5px}
.card .body{padding:16px 18px 18px}
.card .yr{font-family:var(--mono);font-size:12px;color:var(--fg3)}
.card .nm{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:2px 0 0}
.card .nick{color:var(--fg2);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.facts dt{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.facts dd{margin:2px 0 0;font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--s3);color:var(--fg2);border:1px solid var(--line2);white-space:nowrap}
.chip.light{background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--fg);border-color:rgba(255,255,255,.12)}

/* empty */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:56px 24px;text-align:center}
.empty h2{margin:0 0 6px}
.empty p{color:var(--fg2);margin:0 0 20px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);text-decoration:none;font-size:14px;margin-bottom:20px}
.back:hover{color:var(--fg)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:start}
.hero .ph{border-radius:var(--r);border:1px solid var(--line)}
.hero h1{font-size:44px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:24px}
.stats div{background:var(--s1);padding:14px 16px}
.stats dt{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.stats dd{margin:4px 0 0;font-family:var(--mono);font-size:18px;letter-spacing:-.02em}
.stats dd small{font-size:12px;color:var(--fg3)}
.section{margin-top:48px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-head h2{margin:0}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;border-top:1px solid var(--line)}
.spec div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;margin-right:24px}
.spec dt{color:var(--fg3);font-size:14px}
.spec dd{margin:0;text-align:right;font-size:14px;overflow-wrap:anywhere}
.notes{color:var(--fg2);white-space:pre-wrap;margin:0;max-width:72ch}

/* ledger */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters .fld{margin:0;min-width:150px;flex:1 1 150px}
.filters .fld.grow{flex:2 1 220px}
.summary{display:flex;gap:24px;flex-wrap:wrap;color:var(--fg2);font-size:14px;margin:0 0 12px}
.summary b{color:var(--fg);font-family:var(--mono);font-weight:500}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 110px 120px;gap:16px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;border-radius:0}
.row:hover{background:var(--s1)}
.row .d{font-family:var(--mono);font-size:13px;color:var(--fg2)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mi{font-family:var(--mono);font-size:13px;color:var(--fg2);text-align:right}
.row .a{font-family:var(--mono);text-align:right}

/* costs table */
.tbl-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:500;background:var(--s1)}
td.n,th.n{text-align:right;font-family:var(--mono)}
tfoot td{font-weight:600;background:var(--s1);border-bottom:0}
tbody tr:hover td{background:var(--s1)}
td a{text-decoration:none}
td a:hover{text-decoration:underline}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity var(--t-med);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--s1);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform var(--t-med) var(--ease);display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:18px}
.panel-b{padding:22px;overflow-y:auto;flex:1}
.panel-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.panel-f .sp{flex:1}

/* forms */
fieldset{border:0;padding:0;margin:0 0 24px}
legend{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:500;margin-bottom:12px;padding:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;color:var(--fg2);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 12px;min-height:40px;width:100%;transition:border-color var(--t-fast)}
.fld textarea{min-height:88px;resize:vertical}
.fld input:hover,.fld select:hover,.fld textarea:hover{border-color:#4a4c51}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--fg)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--danger)}
.fld .err{color:var(--danger);font-size:12.5px;min-height:0}
.fld .help{color:var(--fg3);font-size:12.5px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);margin:-4px 0 14px}

/* ---------- private photos & invoices (signed links) ---------- */
const SIGNED = {};
const mediaPath = u => { const m = /\/object\/(?:public|sign|authenticated)\/media\/([^?]+)/.exec(u || ''); return m ? decodeURIComponent(m[1]) : null; };
const media = u => { if (!u) return ''; const p = mediaPath(u); return p ? (SIGNED[p] || '') : u; };
async function signMedia() {
  if (!db) return;
  const paths = [...new Set([...S.vehicles.map(v => v.photo_url), ...S.records.map(r => r.invoice_url)].map(mediaPath).filter(p => p && !SIGNED[p]))];
  for (let i = 0; i < paths.length; i += 100) {
    const { data, error } = await db.storage.from('media').createSignedUrls(paths.slice(i, i + 100), 7 * 24 * 3600);
    if (error) { console.warn('Couldn\'t sign media links', error); return; }
    (data || []).forEach(d => { if (d.signedUrl && d.path) SIGNED[d.path] = d.signedUrl; });
  }
}

/* ---------- garage look: logo, background colour, motorcycles on/off ---------- */
const DEFAULT_BG = '#121314';
const BG_DARK = [['#121314', 'Graphite'], ['#16181d', 'Slate'], ['#0f1522', 'Midnight'], ['#0d1a1d', 'Petrol'], ['#0f1a14', 'Racing green'], ['#1d1013', 'Burgundy'], ['#1a1511', 'Espresso'], ['#18121c', 'Plum']];
const BG_LIGHT = [['#f6f6f4', 'Paper'], ['#eef0f3', 'Mist'], ['#f3ede3', 'Sand'], ['#e8eee6', 'Sage'], ['#e6eef2', 'Sky'], ['#f4e9e6', 'Blush'], ['#eeeadf', 'Stone'], ['#ece8f2', 'Lavender']];
const bikesOn = () => S.garage?.show_bikes !== false;
// Dark backgrounds get light text and light backgrounds get dark text. Colours in between are hard to read
// either way, so they're nudged to the nearest readable shade: darkened, or mixed with white.
const rgbOf = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
const lumOf = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
const isLightBg = hex => lumOf(rgbOf(hex)) > 0.5;
function readable(hex) {
  hex = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex.toLowerCase() : DEFAULT_BG;
  const c = rgbOf(hex), L = lumOf(c), toHex = a => '#' + a.map(x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0')).join('');
  if (L <= 0.14 || L >= 0.8) return hex;
  if (L <= 0.5) return toHex(c.map(x => x * 0.14 / L));
  const t = (0.8 - L) / (1 - L);
  return toHex(c.map(x => x + (255 - x) * t));
}
function previewBg(hex) {
  const bg = readable(hex);
  document.documentElement.style.setProperty('--bg', bg);
  document.documentElement.dataset.tone = isLightBg(bg) ? 'light' : 'dark';
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = bg;
}
async function applyLook(g) {
  previewBg(g?.bg_color || DEFAULT_BG);
  const bt = document.querySelector('.tab[data-r="bikes"]'); if (bt) bt.hidden = g ? g.show_bikes === false : false;
  const p = mediaPath(g?.logo_url);
  if (p && !SIGNED[p] && db) { const { data } = await db.storage.from('media').createSignedUrl(p, 7 * 24 * 3600); if (data?.signedUrl) SIGNED[p] = data.signedUrl; }
  if (g !== S.garage && g) return; // another garage was opened meanwhile
  const src = p ? SIGNED[p] || '' : '';
  const img = $('#brand-logo');
  img.src = src || '/icons/icon-192.png?v=1'; img.classList.toggle('logo', !!src); img.alt = src ? (g?.name || '') + ' logo' : '';
  $('#brand-name').hidden = !!src;
}
async function shrinkLogo(file, max = 512) {
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const png = file.type !== 'image/jpeg'; // keep transparency
  const blob = await new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.9));
  return new File([blob], 'logo.' + (png ? 'png' : 'jpg'), { type: png ? 'image/png' : 'image/jpeg' });
}

/* ---------- data (everything is scoped to the garage that's open) ---------- */
const cacheKey = () => 'mg-cache-' + GID();

async function load() {
  if (!db) { await useSnapshot('the database library didn\'t load'); return; }
  try {
    const g = GID(); if (!g) return;
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), 10000));
    const fx = Promise.race([loadFx(), new Promise(r => setTimeout(r, 4000))]);
    const [v, r, o, mc, tk] = await Promise.race([timeout, Promise.all([
      db.from('vehicles').select('*').eq('garage_id', g).order('sort_order').order('year', { ascending: false }),
      db.from('service_records').select('*').eq('garage_id', g).order('date', { ascending: false, nullsFirst: false }),
      db.from('odometer_readings').select('*').eq('garage_id', g).order('date', { ascending: false, nullsFirst: false }),
      db.from('market_comps').select('*').eq('garage_id', g).order('date', { ascending: false }),
      db.from('service_tasks').select('*').eq('garage_id', g).order('created_at', { ascending: false })
    ])]);
    await fx;
    const err = v.error || r.error || o.error || mc.error || tk.error;
    if (err && !load.retried && isJwtErr(err)) {
      load.retried = true; console.warn('Stored sign-in rejected; signing out on this device', err);
      await db.auth.signOut({ scope: 'local' }).catch(() => {}); toast('Your sign-in expired. Please sign in again.', true); return load();
    }
    if (err) throw err;
    S.vehicles = v.data; S.records = sortRecs(r.data); S.readings = o.data; S.comps = mc.data || []; S.tasks = tk.data || []; S.offline = null;
    await signMedia();
    try { localStorage.setItem(cacheKey(), JSON.stringify({ saved: new Date().toISOString().slice(0, 10), vehicles: v.data, records: r.data, readings: o.data, comps: mc.data || [], tasks: tk.data || [] })); } catch (e) {}
    setLive('live');
    setTimeout(() => refreshFipe(), 50);
  } catch (e) { console.warn('Database unreachable, showing saved copy', e); await useSnapshot(/timed out/.test(e.message || '') ? 'the database didn\'t answer' : 'the database couldn\'t be reached'); return; }
  render();
}
async function useSnapshot(reason) {
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); } catch (e) {}
  snap = snap || { vehicles: [], records: [], readings: [] };
  S.vehicles = snap.vehicles || []; S.records = sortRecs(snap.records || []); S.readings = snap.readings || []; S.comps = snap.comps || []; S.tasks = snap.tasks || [];
  if (!S.fx) await loadFx().catch(() => {});

}

async function refreshAuth(session) {
  if (!db) { showLogin('The app couldn\'t start. Check your connection and reload the page.'); return; }

  const prev = S.user?.id;

  if (!S.user) {
    S.editor = false; S.role = null; S.garage = null; S.garages = [];

    clearCaches();

  }
  $('#acct-btn').textContent = 'Account';

    await db.rpc('accept_invites').then(r => { if (r.data > 0) pendingToast = r.data === 1 ? 'You joined a garage you were invited to' : `You joined ${r.data} garages you were invited to`; }, () => {});

  else if (pendingInstall) openPendingInstall(); else maybeTour();
}

function authMsg(err) {

  if (/invalid login credentials/i.test(m)) return 'That email and password don\'t match. Check both, or create an account if you\'re new.';
  if (/signups? not allowed/i.test(m)) return 'New accounts are paused right now. Try again later.';
  if (/rate limit/i.test(m)) return 'Too many attempts. Wait a few minutes and try again.';
  if (/already registered/i.test(m)) return 'This email already has an account. Switch to Sign in.';
  if (/email not confirmed/i.test(m)) return 'Confirm your email first: open the link we sent you, then sign in.';
  if (/password should be at least/i.test(m)) return 'Use at least 8 characters for the password.';
  if (/weak|pwned|leaked/i.test(m)) return 'That password appears in known data leaks. Choose a different one.';
  if (/failed to fetch|network/i.test(m)) return 'Couldn\'t reach the database. Check your connection and try again.';
  return m || 'Something went wrong. Try again.';
}

    ]);

function field(name, label, type, value, o = {}) {
  const id = 'f-' + name;
  let input;
  if (type === 'select') input = `<select id="${id}" name="${name}">${o.options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(value ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  else if (type === 'textarea') input = `<textarea id="${id}" name="${name}">${esc(value)}</textarea>`;
  else if (type === 'date') input = dateInput(`id="${id}" name="${name}"`, value);
  else input = `<input id="${id}" name="${name}" type="${type}" value="${esc(value)}"${o.ac ? ` autocomplete="${o.ac}"` : ''}${o.step ? ` step="${o.step}"` : ''}${o.inputmode ? ` inputmode="${o.inputmode}"` : ''}${o.accept ? ` accept="${o.accept}"` : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>`;
  return `<div class="fld" data-f="${name}"><label for="${id}">${esc(label)}${o.required ? '' : ' <span class="hint">(optional)</span>'}</label>${input}${o.help ? `<span class="help">${esc(o.help)}</span>` : ''}<span class="err" id="${id}-err" aria-live="polite"></span></div>`;
}
function wireForm(sel, rules, onSubmit) {
  const form = $(sel); if (!form) return;
  const touched = new Set();
  const check = (name, show) => {
    const el = form.elements[name]; const isDate = !!el?.hasAttribute?.('data-date');
    if (!el || (!rules[name] && !isDate)) return '';
    const iso = isDate ? isoFromDmy(el.value) : undefined;
    const msg = iso === null ? DATE_MSG : rules[name] ? rules[name](el.type === 'file' ? el.files : iso !== undefined ? iso : el.value, form) : '';
    const box = form.querySelector(`[data-f="${name}"]`);
    if (show) { box.classList.toggle('bad', !!msg); box.querySelector('.err').textContent = msg; el.setAttribute('aria-invalid', msg ? 'true' : 'false'); }
    return msg;
  };
  form.addEventListener('input', e => { const n = e.target.name; if (!n) return; touched.add(n); const box = form.querySelector(`[data-f="${n}"]`); if (box && box.classList.contains('bad')) check(n, true); });
  form.addEventListener('focusout', e => { const n = e.target.name; if (n && touched.has(n)) check(n, true); });
  const submit = async e => {
    e.preventDefault();
    const bad = [...new Set([...Object.keys(rules), ...[...form.querySelectorAll('input[data-date]')].map(x => x.name)])].filter(n => check(n, true));
    form.querySelector('.form-err')?.remove();
    if (bad.length) { form.elements[bad[0]].focus(); return; }
    const btns = [...document.querySelectorAll('#panel button[type=submit], #panel [data-submit]')];
    btns.forEach(b => b.disabled = true);
    try {
      const vals = Object.fromEntries([...form.elements].filter(x => x.name && (x.type !== 'radio' || x.checked)).map(x => [x.name, x.type === 'checkbox' ? x.checked : x.type === 'file' ? x.files : x.hasAttribute('data-date') ? isoFromDmy(x.value) || '' : x.value]));
      await onSubmit(vals);
    } catch (err) {
      form.insertAdjacentHTML('afterbegin', `<div class="form-err" role="alert">${esc(err.message || err)}</div>`);
      $('#panel-b').scrollTop = 0;
    } finally { btns.forEach(b => b.disabled = false); }
  };
  form.addEventListener('submit', submit);
  document.querySelectorAll('#panel [data-submit]').forEach(b => b.onclick = () => form.requestSubmit());
}

/* ---------- uploads ---------- */
async function shrinkImage(file, max = 1800) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}
async function upload(file, prefix) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${GID()}/${prefix}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await db.storage.from('media').upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw new Error('The file didn\'t upload: ' + error.message + '. Try again, or save without it.');
  return db.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* ---------- illustrations: a vehicle's photo redrawn as a vector-style illustration ---------- */
// Runs after a photo is uploaded (or from "Make illustration"). The illustration replaces the photo.
const ILLUS = new Map(); // vehicle id → when its drawing started
const isIllus = v => /\/illus\//.test(v?.photo_url || '');
// The model reports no progress, so the bar follows the usual time (about a minute) and waits near the end
const illPct = id => Math.round(95 * (1 - Math.exp(-(Date.now() - ILLUS.get(id)) / 28000)));
const progHtml = id => `<div class="ill-prog"><b>Drawing the illustration…</b><div class="ill-bar" role="progressbar" aria-label="Drawing the illustration" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${illPct(id)}" data-prog="${id}"><i style="width:${illPct(id)}%"></i></div></div>`;
let illTimer = null;
const tickIllus = () => {
  document.querySelectorAll('[data-prog]').forEach(b => { if (!ILLUS.has(b.dataset.prog)) return; const p = illPct(b.dataset.prog); b.firstElementChild.style.width = p + '%'; b.setAttribute('aria-valuenow', p); });
  if (!ILLUS.size) { clearInterval(illTimer); illTimer = null; }
};
async function illustrate(v) {
  if (!v || ILLUS.has(v.id) || !v.photo_url) return;
  ILLUS.set(v.id, Date.now()); render();
  if (!illTimer) illTimer = setInterval(tickIllus, 1000);
  toast(`Drawing an illustration of ${vshort(v)}. This takes about a minute.`);
  try {
    const { data, error } = await db.functions.invoke('illustrate', { body: { garage_id: GID(), vehicle_id: v.id } });
    let res = data; if (error) { try { res = await error.context.json(); } catch (x) { res = { message: 'The illustrator couldn\'t be reached. Check your connection and try again.' }; } }
    if (res?.error === 'limit') { aiLimitPanel(res.message); return; }
    if (!res || !res.ok) throw new Error(res?.message || 'The illustration couldn\'t be made.');
    // 1024 px from the model, stored at 1000 x 1000
    const bin = Uint8Array.from(atob(res.image), c => c.charCodeAt(0));
    const img = await createImageBitmap(new Blob([bin], { type: 'image/png' }));
    const c = document.createElement('canvas'); c.width = c.height = 1000;
    const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, 1000, 1000);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    const cur = vById(v.id) || v, old = mediaPath(cur.photo_url);
    const url = await upload(new File([blob], 'illustration.jpg', { type: 'image/jpeg' }), `vehicles/${v.id}/illus`);
    const { data: row, error: e2 } = await db.from('vehicles').update({ photo_url: url }).eq('id', v.id).select().single();
    if (e2) throw new Error('The illustration was made but couldn\'t be saved: ' + e2.message);
    if (old && old !== mediaPath(url)) db.storage.from('media').remove([old]).catch(() => {}); // the original photo is replaced
    // finish the bar, then swap the dimmed photo for the illustration
    document.querySelectorAll(`[data-prog="${v.id}"] i`).forEach(i => i.style.width = '100%');
    S.vehicles = S.vehicles.map(x => x.id === v.id ? row : x);
    await signMedia();
    await new Promise(r => setTimeout(r, 600));
    toast(`Illustration ready for ${vshort(row)}`);
  } catch (x) {
    toast(x.message || 'The illustration couldn\'t be made.', true);

function costsBody() {
  const head = '';
  const rows = S.vehicles.map(v => ({ v, p: paid(v), s: spent(v.id), n: recsFor(v.id).length, last: recsFor(v.id).find(r => r.date)?.date }));
  const T = { p: addSums(...rows.map(r => r.p)), s: addSums(...rows.map(r => r.s)), n: rows.reduce((a, r) => a + r.n, 0) };
  const byCat = Object.keys(CATEGORIES).map(k => { const l = S.records.filter(r => r.category === k); return [k, sumBy(l), l.length]; }).filter(x => x[2]);
  return head + `
    <dl class="stats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:0 0 32px">
      <div><dt>Purchase value</dt><dd>${msum(T.p).replace(' + ', '<br>')}</dd></div>
      <div><dt>Service & parts</dt><dd>${msum(T.s).replace(' + ', '<br>')}</dd></div>
      <div><dt>Total in</dt><dd>${msum(addSums(T.p, T.s)).replace(' + ', '<br>')}</dd></div>
      <div><dt>Vehicles</dt><dd>${S.vehicles.length}</dd></div>
    </dl>
    <h2>By vehicle</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th scope="col">Vehicle</th><th scope="col" class="n">Purchase</th><th scope="col" class="n">Service & parts</th><th scope="col" class="n">Total in</th><th scope="col" class="n">Records</th><th scope="col" class="n">Last service</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td><a href="#/vehicle/${r.v.id}">${esc(vname(r.v))}</a></td><td class="n">${msum(r.p)}</td><td class="n">${msum(r.s)}</td><td class="n">${msum(addSums(r.p, r.s))}</td><td class="n">${r.n}</td><td class="n">${fdate(r.last)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>All vehicles</td><td class="n">${msum(T.p)}</td><td class="n">${msum(T.s)}</td><td class="n">${msum(addSums(T.p, T.s))}</td><td class="n">${T.n}</td><td class="n"></td></tr></tfoot>
    </table></div>
    ${byCat.length ? `<div class="section"><h2>By category</h2><div class="tbl-wrap"><table>
      <thead><tr><th scope="col">Category</th><th scope="col" class="n">Records</th><th scope="col" class="n">Spent (R$)</th><th scope="col" class="n">Spent (US$)</th></tr></thead>
      <tbody>${byCat.sort((a, b) => (b[1].BRL || 0) - (a[1].BRL || 0) || (b[1].USD || 0) - (a[1].USD || 0)).map(([k, s, n]) => `<tr><td>${CATEGORIES[k]}</td><td class="n">${n}</td><td class="n">${s.BRL ? money(s.BRL, 1, 'BRL') : '—'}</td><td class="n">${s.USD ? money(s.USD, 1, 'USD') : '—'}</td></tr>`).join('')}</tbody>
    </table></div></div>` : ''}`;
}

/* ---------- charts ---------- */
const YEAR = new Date().getFullYear();
const KM_MI = 0.621371;
let distUnit = (() => { try { return localStorage.getItem('mg-unit') || 'km'; } catch (e) { return 'km'; } })();
const GF = { k: 'all' };
const conv = (o, u, to) => u === to ? o : to === 'mi' ? o * KM_MI : o / KM_MI;
function pointsFor(v) {
  const p = [];
  S.readings.filter(r => r.vehicle_id === v.id && r.date && r.odometer != null).forEach(r => p.push({ d: r.date, o: +r.odometer, u: r.unit }));
  recsFor(v.id).filter(r => r.date && r.mileage != null).forEach(r => p.push({ d: r.date, o: +r.mileage, u: v.odometer_unit }));
  if (v.odometer != null && v.odometer_date) p.push({ d: v.odometer_date, o: +v.odometer, u: v.odometer_unit });
  return p.sort((a, b) => a.d.localeCompare(b.d));
}
function hourPoints(v) {
  const p = S.readings.filter(r => r.vehicle_id === v.id && r.date && r.hours != null).map(r => ({ d: r.date, o: +r.hours }));
  recsFor(v.id).filter(r => r.date && r.hours != null).forEach(r => p.push({ d: r.date, o: +r.hours }));
  if (v.hours != null && v.odometer_date) p.push({ d: v.odometer_date, o: +v.hours });
  return p.sort((a, b) => a.d.localeCompare(b.d));
}
function drivenIn(v, year, to) {
  const y = String(year), p = pointsFor(v).map(x => ({ d: x.d, o: conv(x.o, x.u, to) }));
  const before = p.filter(x => x.d < y + '-01-01'), inY = p.filter(x => x.d.startsWith(y));
  if (!inY.length) return 0;
  const base = before.length ? before[before.length - 1].o : inY[0].o;
  return Math.max(0, Math.max(...inY.map(x => x.o)) - base);
}
const niceMax = v => { if (v <= 0) return 1; const e = 10 ** Math.floor(Math.log10(v)), m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; };
const short = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(Math.round(n));
const SYM = { BRL: 'R$', USD: 'US$' };
function chartCard(title, sub, viz, rows, tools = '') {

}
function hbars(items, fmt) {

}
function vbars(items, axis) {

}
const LINES = {}; let lineN = 0;
function lineChart(pts, fmtY, unitLabel) {
  if (pts.length < 2) return `<p class="none">Log at least two readings to see a trend.</p>`;
  const t = pts.map(p => Date.parse(p.d)), t0 = Math.min(...t), t1 = Math.max(...t) || t0 + 1;
  let lo = Math.min(...pts.map(p => p.o)), hi = Math.max(...pts.map(p => p.o));
  const pad = (hi - lo) * .08 || 1; lo = Math.max(0, lo - pad); hi += pad;
  const X = ti => (t1 === t0 ? 50 : (ti - t0) / (t1 - t0) * 100), Y = o => 100 - (o - lo) / (hi - lo) * 100;
  const id = 'lc' + (++lineN);
  LINES[id] = pts.map((p, i) => ({ x: X(t[i]), y: Y(p.o), d: p.d, o: p.o }));
  const path = LINES[id].map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear();
  const xl = y0 === y1 ? [[0, fdate(pts[0].d), 'first'], [100, fdate(pts[pts.length - 1].d), 'last']] : [[0, y0, 'first'], [100, y1, 'last'], ...(y1 - y0 > 2 ? [[X(Date.parse(Math.round((y0 + y1) / 2) + '-01-01')), Math.round((y0 + y1) / 2), '']] : [])];
  return `<div class="lc" id="${id}" data-unit="${esc(unitLabel)}">
    ${[0, .5, 1].map(f => `<div class="g" style="top:calc(${f} * (100% - 24px))"><span>${fmtY(hi - (hi - lo) * f)}</span></div>`).join('')}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${path}" fill="none" stroke="var(--fg)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>
    ${xl.map(([x, l, c]) => `<span class="xl ${c}" style="left:${x}%">${esc(l)}</span>`).join('')}
    <div class="xh"></div><div class="dot"></div><div class="hit"></div></div>`;
}
function wireLine(el) {
  const pts = LINES[el.id]; if (!pts) return;
  const hit = el.querySelector('.hit'), xh = el.querySelector('.xh'), dot = el.querySelector('.dot'), h = () => hit.getBoundingClientRect().height;
  const show = e => {
    const r = hit.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * 100;

    xh.style.left = p.x + '%'; xh.style.display = 'block';
    dot.style.left = p.x + '%'; dot.style.top = (p.y / 100 * h()) + 'px'; dot.style.display = 'block';

}
const tipEl = () => document.getElementById('tip');
function showTip(text, x, y) { const t = tipEl(); t.textContent = text; t.classList.add('on'); const w = t.offsetWidth, hh = t.offsetHeight; t.style.left = Math.min(innerWidth - w - 8, Math.max(8, x + 14)) + 'px'; t.style.top = Math.max(8, y - hh - 12) + 'px'; }

/* ---------- readings ---------- */
// The vehicle's current odometer/hours always follow its newest dated reading, so fixing or
// deleting a wrong entry also corrects the figure shown on cards and the dashboard.
async function syncCurrent(v) {
  const rs = S.readings.filter(x => x.vehicle_id === v.id && x.date).sort((a, b) => b.date.localeCompare(a.date) || (+b.odometer || 0) - (+a.odometer || 0));
  const lo = rs.find(x => x.odometer != null), lh = rs.find(x => x.hours != null);
  if (!lo && !lh) return;
  const upd = {};
  if (lo) { upd.odometer = lo.unit === v.odometer_unit ? +lo.odometer : Math.round(conv(+lo.odometer, lo.unit, v.odometer_unit)); }
  if (lh) upd.hours = +lh.hours;
  upd.odometer_date = [lo?.date, lh?.date].filter(Boolean).sort().pop();
  const cur = vById(v.id);
  if (cur && cur.odometer == upd.odometer && cur.odometer_date === upd.odometer_date && (upd.hours === undefined || cur.hours == upd.hours)) return;
  const u = await db.from('vehicles').update(upd).eq('id', v.id).select().single();
  if (!u.error) S.vehicles = S.vehicles.map(x => x.id === v.id ? { ...x, ...u.data } : x);
}
function openReadingForm(v, r) {
  const isNew = !r;
  r = r || { date: new Date().toISOString().slice(0, 10), unit: v.odometer_unit || 'mi' };
  const dist = v.meter !== 'hours', hrs = v.meter !== 'distance';
  openPanel(isNew ? 'Log reading' : 'Edit reading', `
    <p class="hint" style="margin:0 0 18px">${esc(vname(v))}${v.odometer != null || v.hours != null ? ` · last recorded ${readingStr(v.odometer, v.odometer_unit, v.hours)}${v.odometer_date ? ' on ' + fdate(v.odometer_date) : ''}` : ''}</p>
    <form id="rd-form" novalidate>
      ${field('date', 'Date of reading', 'date', r.date, { required: isNew || !!r.date, help: !isNew && !r.date ? 'This reading has no date. Add one if you know it.' : '' })}
      ${dist ? `<div class="two">${field('odometer', 'Odometer', 'text', r.odometer != null ? num(r.odometer) : '', { inputmode: 'numeric', required: !hrs })}${field('unit', 'Unit', 'select', r.unit, { required: true, options: [['mi', 'Miles'], ['km', 'Kilometres']] })}</div>` : ''}
      ${hrs ? field('hours', 'Engine hours', 'text', r.hours ?? '', { inputmode: 'decimal', required: !dist }) : ''}
      ${field('notes', 'Note', 'text', r.notes, { ph: 'Before track day, after trip…' })}
      ${!isNew ? `<fieldset style="margin-top:8px"><legend>Delete</legend><div id="del-box"><button class="btn danger" type="button" id="del-rd">Delete this reading…</button></div></fieldset>` : ''}
    </form>`,
    `<button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary" type="button" data-submit>${isNew ? 'Save reading' : 'Save changes'}</button>`);
  $('#cancel').onclick = closePanel;
  if (!isNew) $('#del-rd').onclick = () => {
    $('#del-box').innerHTML = `<div class="confirm"><p>Delete the reading of <b>${esc(readingStr(r.odometer, r.unit, r.hours))}</b>${r.date ? ' from ' + fdate(r.date) : ''}? This can't be undone.</p>
      <button class="btn" type="button" id="del-no">Keep it</button> <button class="btn danger solid" type="button" id="del-yes">Delete reading</button></div>`;
    $('#del-no').onclick = () => openReadingForm(v, r);
    $('#del-yes').onclick = async () => {
      const { error } = await db.from('odometer_readings').delete().eq('id', r.id);
      if (error) return toast('Couldn\'t delete: ' + error.message, true);
      S.readings = S.readings.filter(x => x.id !== r.id); await syncCurrent(v); closePanel(); toast('Reading deleted'); render();
    };
  };
  const rules = {
    date: x => !x ? (isNew || r.date ? 'Enter the date of the reading.' : '') : x > new Date().toISOString().slice(0, 10) ? 'The date can\'t be in the future.' : '',
  };
  if (dist) rules.odometer = (x, f) => x && !/^[\d,]+$/.test(x.trim()) ? 'Odometer should be a whole number, like 62,950.' : (!x && (!hrs || !f.elements.hours.value)) ? 'Enter the odometer reading.' : '';
  if (hrs) rules.hours = (x, f) => x && !/^[\d,]*\.?\d?$/.test(x.trim()) ? 'Engine hours should be a number, like 123.5.' : (!x && (!dist || !f.elements.odometer.value)) ? 'Enter the engine hours.' : '';
  let warned = false;
  wireForm('#rd-form', rules, async f => {
    if (!warned && dist && f.date && f.odometer) {
      const o = conv(nInt(f.odometer), f.unit, v.odometer_unit);
      const others = S.readings.filter(x => x.vehicle_id === v.id && x.id !== r.id && x.date && x.odometer != null).map(x => ({ d: x.date, o: conv(+x.odometer, x.unit, v.odometer_unit) }));
      const later = others.filter(x => x.d < f.date && x.o > o + 0.5).sort((a, b) => b.o - a.o)[0];
      const earlier = others.filter(x => x.d > f.date && x.o < o - 0.5).sort((a, b) => a.o - b.o)[0];

const today = () => new Date().toISOString().slice(0, 10);
async function loadFx() {
  try { const c = JSON.parse(localStorage.getItem('mg-fx') || 'null'); if (c && c.rate) S.fx = c; } catch (e) {}
  try {
    const r = await fetch('/fx/latest?base=USD&symbols=BRL', { cache: 'no-store' }); const j = await r.json();
    if (j && j.rates && j.rates.BRL) { S.fx = { rate: +j.rates.BRL, date: j.date }; try { localStorage.setItem('mg-fx', JSON.stringify(S.fx)); } catch (e) {} }

}
const toCur = (amt, from, to) => amt == null ? null : from === to ? +amt : !S.fx ? null : from === 'USD' ? amt * S.fx.rate : amt / S.fx.rate;
const median = a => { const s = [...a].sort((x, y) => x - y), n = s.length; return !n ? null : n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
const compsFor = id => (S.comps || []).filter(c => c.vehicle_id === id).sort((a, b) => b.date.localeCompare(a.date));
function valuation(v) {
  const cur = v.currency || 'USD';
  if (v.value_source === 'manual') return v.estimated_value != null ? { value: +v.estimated_value, source: 'manual', label: 'Your estimate' + (v.value_date ? ' · ' + fdate(v.value_date) : '') } : { value: null, source: 'manual', label: 'No estimate yet' };
  const inc = compsFor(v.id).filter(c => c.include);
  const cutoff = new Date(Date.now() - 730 * 864e5).toISOString().slice(0, 10);
  let pool = inc.filter(c => c.date >= cutoff); if (!pool.length) pool = inc;
  const own = pool.filter(c => c.currency === cur); if (own.length) pool = own; // e.g. Webmotors (R$) for a Brazilian car beats BaT (US$)
  const sold = pool.filter(c => c.kind === 'sold'), use = sold.length ? sold : pool;
  const vals = use.map(c => toCur(+c.price, c.currency, cur)).filter(x => x != null);
  const allWm = use.every(c => c.source === 'webmotors');
  if (vals.length) return { value: median(vals), source: 'comps', label: allWm ? `Median of ${vals.length} Webmotors listing${vals.length === 1 ? '' : 's'}` : `Median of ${vals.length} ${sold.length ? 'sold' : 'asking'} price${vals.length === 1 ? '' : 's'}` };
  if (v.fipe_value != null) { const x = toCur(+v.fipe_value, 'BRL', cur); if (x != null) return { value: x, source: 'fipe', label: 'FIPE' + (v.fipe_ref ? ' · ' + v.fipe_ref : '') }; }

  const svc = recsFor(v.id).reduce((a, r) => a + (toCur(+r.amount || 0, r.currency || cur, cur) || 0), 0);

/* ---------- service to-do ---------- */
// Service clock: Soon from 9 months after the last service, Due at 12 months, Overdue after 14 months.
const SVC_CATS = ['maintenance', 'repair', 'restoration', 'inspection'];
const addMonths = (d, m) => { const x = new Date(d + 'T12:00:00Z'); const day = x.getUTCDate(); x.setUTCDate(1); x.setUTCMonth(x.getUTCMonth() + m); const last = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate(); x.setUTCDate(Math.min(day, last)); return x.toISOString().slice(0, 10); };
const SVC_ST = {
  overdue: { label: 'Overdue', color: '#d03b3b', rank: 0 },
  due: { label: 'Due', color: '#ec835a', rank: 1 },
  soon: { label: 'Soon', color: '#fab219', rank: 2 },
  planned: { label: 'Planned', color: '#8a8c92', rank: 3 },
  ok: { label: 'Up to date', color: '#0ca30c', rank: 4 }
};
const TF = { k: 'all' };
const lastService = v => recsFor(v.id).find(r => r.date && SVC_CATS.includes(r.category))?.date || null;
const openTask = v => (S.tasks || []).find(t => t.vehicle_id === v.id && !t.done);
function clockStatus(base) { // base = date the 12-month clock counts from
  const t = today();
  if (t >= addMonths(base, 14)) return 'overdue';
  if (t >= addMonths(base, 12)) return 'due';
  if (t >= addMonths(base, 9)) return 'soon';
  return 'ok';
}
function svcStatus(v) {
  const last = lastService(v), task = openTask(v);
  let key = last ? clockStatus(last) : 'overdue';
  let due = last ? addMonths(last, 12) : null;
  if (task && task.due_date) { // a task with its own date follows that date instead
    const k2 = clockStatus(addMonths(task.due_date, -12));
    if (SVC_ST[k2].rank < SVC_ST[key].rank || key === 'ok') { key = k2; due = task.due_date; }
    if (key === 'ok') key = 'planned';

}
const stChip = k => `<span class="stc" style="--c:${SVC_ST[k].color}"><i aria-hidden="true"></i>${SVC_ST[k].label}</span>`;
function todoItems() {
  return S.vehicles.filter(v => v.status !== 'sold').map(v => ({ v, ...svcStatus(v) })).filter(x => x.key !== 'ok')
    .sort((a, b) => SVC_ST[a.key].rank - SVC_ST[b.key].rank || (a.noHistory - b.noHistory) || (a.due || '').localeCompare(b.due || ''));
}
const monthYear = d => { if (!d) return ''; const [y, m] = d.split('-'); return `${m}/${y}`; };

      ${t ? `<div class="todo-task"><b>${esc(t.title)}</b>${needs.length ? `<ul>${needs.slice(0, 6).map(n => `<li>${esc(n)}</li>`).join('')}${needs.length > 6 ? `<li class="hint">+${needs.length - 6} more</li>` : ''}</ul>` : ''}</div>` : ''}
    </div>
    ${S.editor ? `<div class="todo-act"><button class="btn sm" type="button" data-task="${x.v.id}">${t ? 'Edit needs' : 'Add needs'}</button><button class="btn sm primary" type="button" data-complete="${x.v.id}">Complete</button></div>` : ''}

function todoSection() {

  V.querySelectorAll('[data-task]').forEach(b => b.onclick = () => { const v = b.dataset.task ? vById(b.dataset.task) : null; openTaskForm(v, v ? openTask(v) : null); });
  V.querySelectorAll('[data-complete]').forEach(b => b.onclick = () => openCompleteForm(vById(b.dataset.complete)));
  V.querySelectorAll('[data-pcur]').forEach(b => b.onclick = () => { PCUR = b.dataset.pcur; try { localStorage.setItem('mg-pcur', PCUR); } catch (e) {} render(); });
  V.querySelectorAll('[data-add-comp]').forEach(b => b.onclick = () => openCompForm(vById(b.dataset.addComp)));
  V.querySelectorAll('[data-comp]').forEach(b => b.onclick = () => { const c = S.comps.find(x => x.id === b.dataset.comp); if (S.editor) openCompForm(vById(c.vehicle_id), c); });
  V.querySelectorAll('[data-fipe]').forEach(b => b.onclick = () => openFipeForm(vById(b.dataset.fipe)));
  V.querySelectorAll('[data-vsrc]').forEach(b => b.onclick = async () => { const v = vById(current().b); const u = await db.from('vehicles').update({ value_source: b.dataset.vsrc }).eq('id', v.id).select().single(); if (u.error) return toast('Couldn\'t save: ' + u.error.message, true); S.vehicles = S.vehicles.map(x => x.id === v.id ? { ...x, ...u.data } : x); render(); if (b.dataset.vsrc === 'manual' && u.data.estimated_value == null) openVehicleForm(vById(v.id)); });
  const keep = (id, k) => { const el = $(id); if (!el) return; el.oninput = el.onchange = () => { LF[k] = el.value; const pos = el.selectionStart; render(); const n = $(id); n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); }; };
  keep('#lf-q', 'q'); keep('#lf-v', 'v'); keep('#lf-c', 'c'); keep('#lf-y', 'y');
  const c = $('#lf-clear'); if (c) c.onclick = () => { Object.keys(LF).forEach(k => LF[k] = ''); render(); };
}
let lastRoute = '';
window.addEventListener('hashchange', () => {
  if (location.hash === '#/install') { history.replaceState(null, '', S.user ? '#/dashboard' : location.pathname); render(); openInstall(false); return; }
  if ($('#panel').classList.contains('on')) closePanel();
  render();
  const r = current().a; if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
  $('#view').focus({ preventScroll: true });
});
$('#acct-btn').onclick = openAccount;
// Back from Stripe Checkout (/?billing=done#/plans): wait for the webhook to move the plan
let pendingBilling = /[?&]billing=done/.test(location.search);
if (pendingBilling) history.replaceState(null, '', location.pathname + location.hash);
// The quicklink /#/install opens the add-to-home-screen sheet, signed in or not
if (location.hash === '#/install') { history.replaceState(null, '', location.pathname); pendingInstall = true; }

if (!db) showLogin('The app couldn\'t start. Check your connection and reload the page.');
// Never call Supabase from inside onAuthStateChange: the library holds its auth lock while the
// callback runs, so a getSession() or query there waits on itself forever and every request stalls.
// Deferring with setTimeout lets the lock release first. (INITIAL_SESSION fires on subscribe.)
if (db) db.auth.onAuthStateChange((event, session) => { setTimeout(() => refreshAuth(session), 0); });
</script>
